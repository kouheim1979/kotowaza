<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2e8">
  <meta name="description" content="ことわざ・慣用句・四字熟語・会話の決まり文句をランダムに引いて、意味と例文を学べます。">
  <title>ことばくじ ｜ ことばクエスト</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6f2e8;
      --card: #fffdf7;
      --ink: #25382f;
      --muted: #52635a;
      --line: #dcd9ca;
      --green: #1c473a;
      --green-dark: #17392f;
      --serif: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.65 system-ui, "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    button, select { font: inherit; }

    :focus-visible {
      outline: 3px solid #a0442b;
      outline-offset: 3px;
    }

    .wrap {
      width: min(100% - 36px, 960px);
      margin-inline: auto;
    }

    .site-header {
      border-bottom: 1px solid var(--line);
    }

    .back-link {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      gap: 0.65em;
      color: var(--green);
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover { text-decoration: underline; }

    main { padding: clamp(18px, 4vw, 36px) 0 56px; }

    .hero {
      position: relative;
      isolation: isolate;
      display: grid;
      align-items: center;
      min-height: 220px;
      padding: clamp(24px, 5vw, 46px);
      overflow: hidden;
      border-radius: 20px;
      background: radial-gradient(ellipse at 90% 15%, #2d5948, transparent 62%), var(--green-dark);
      color: #fff8e9;
    }

    .hero h1 {
      margin: 0 0 0.22em;
      font: 700 clamp(2.6rem, 8vw, 4.85rem)/1.12 var(--serif);
      letter-spacing: 0.04em;
    }

    .hero p {
      max-width: 27em;
      margin: 0;
      color: #e6eee4;
      font-size: clamp(0.94rem, 2.5vw, 1.05rem);
      line-height: 1.85;
    }

    .hero-art {
      position: absolute;
      z-index: -1;
      top: 50%;
      right: 10%;
      width: 155px;
      height: 170px;
      transform: translateY(-50%);
    }

    .hero-art::before, .hero-art::after {
      position: absolute;
      display: block;
      width: 98px;
      height: 140px;
      border: 1px solid #9ab89f;
      border-radius: 11px;
      content: "";
    }

    .hero-art::before {
      inset: 10px auto auto 4px;
      transform: rotate(-20deg);
      background: repeating-linear-gradient(45deg, #69877538 0 1px, transparent 1px 7px), #315847;
    }

    .hero-art::after {
      inset: 10px 5px auto auto;
      transform: rotate(14deg);
      background: linear-gradient(#d1b481, #d1b481) 14px 14px / 23px 3px no-repeat,
                  repeating-linear-gradient(#8c8e7738 0 1px, transparent 1px 7px) center 61% / 62% 37% no-repeat,
                  #f1e7c9;
      box-shadow: 0 9px 20px #0d2c2466;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
      gap: 14px 20px;
      align-items: end;
      padding: 16px 18px;
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--card);
    }

    .control-label {
      display: block;
      padding: 0;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .select, .draw-button {
      min-height: 46px;
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #aea99a;
      border-radius: 9px;
      background: #fffdf9;
      color: var(--ink);
      font-weight: 650;
    }

    .draw-button {
      min-width: 10em;
      border-color: var(--green);
      background: var(--green);
      color: #fff;
      cursor: pointer;
    }

    .draw-button:hover { background: var(--green-dark); }

    fieldset {
      min-inline-size: 0;
      padding: 0;
      margin: 0;
      border: 0;
    }

    .count-options {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) repeat(3, minmax(0, 1fr));
      gap: 4px;
      padding: 3px;
      border: 1px solid #aea99a;
      border-radius: 9px;
      background: #ebe9dd;
    }

    .count-options label {
      display: grid;
      min-height: 38px;
      place-items: center;
      border-radius: 6px;
      color: var(--green-dark);
      font-size: 0.91rem;
      font-weight: 700;
      cursor: pointer;
    }

    .count-options label:hover { background: #fffdf9; }

    .count-options input:checked + label {
      background: #fffdf9;
      color: var(--green-dark);
      box-shadow: 0 1px 4px #25382f22, inset 0 0 0 1px #beb9aa;
    }

    .count-options input:focus-visible + label {
      outline: 3px solid #a0442b;
      outline-offset: 1px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .result-heading {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin: 22px 0 11px;
    }

    .result-heading h2 {
      margin: 0;
      font: 700 1.28rem/1.4 var(--serif);
    }

    .result-count {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
      gap: 12px;
    }

    .cards[data-count="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .word-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-top: 3px solid var(--accent);
      border-radius: 13px;
      background: var(--card);
      box-shadow: 0 2px 5px #3f362509;
      animation: appear 200ms ease-out both;
    }

    .word-card[data-category="proverb"] {
      --accent: #ae5e3d;
      --badge: #f8e6d9;
      --badge-ink: #813b24;
    }

    .word-card[data-category="idiom"] {
      --accent: #527d66;
      --badge: #e5eee5;
      --badge-ink: #305746;
    }

    .word-card[data-category="koji"] {
      --accent: #6575a0;
      --badge: #e7eaf4;
      --badge-ink: #41537b;
    }

    .word-card[data-category="phrase"] {
      --accent: #a68242;
      --badge: #f4ebd7;
      --badge-ink: #735224;
    }

    .card-face {
      display: flex;
      min-height: 170px;
      flex-direction: column;
      align-items: flex-start;
      padding: 14px 16px 11px;
      cursor: pointer;
      list-style: none;
    }

    .card-face::-webkit-details-marker { display: none; }
    .card-face:hover { background: #f9f6ed; }
    .card-face:focus-visible { outline-offset: -4px; }

    .category-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--badge);
      color: var(--badge-ink);
      font-size: 0.76rem;
      font-weight: 700;
    }

    .phrase {
      margin-top: 8px;
      color: var(--ink);
      font: 700 clamp(1.15rem, 2.6vw, 1.55rem)/1.4 var(--serif);
      overflow-wrap: anywhere;
      line-break: strict;
    }

    .reading {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.84rem;
      overflow-wrap: anywhere;
    }

    .card-action {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 9px;
      margin-top: auto;
      color: var(--green);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .chevron {
      width: 0.45em;
      height: 0.45em;
      margin-right: 2px;
      border: solid currentColor;
      border-width: 0 2px 2px 0;
      transform: translateY(-25%) rotate(45deg);
    }

    [open] .chevron { transform: translateY(25%) rotate(225deg); }

    .card-notes {
      display: grid;
      gap: 10px;
      padding: 10px 16px 14px;
      margin: 0;
      border-top: 1px solid var(--line);
      background: #faf7ee;
      font-size: 0.94rem;
      overflow-wrap: anywhere;
    }

    .card-notes dt {
      color: var(--green);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .card-notes dd { margin: 1px 0 0; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 760px) {
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .draw-button { grid-column: 1 / -1; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero-art { right: 6%; }
    }

    @media (max-width: 560px) {
      .wrap { width: calc(100% - 28px); }
      .hero { min-height: 175px; }
      .hero h1 { font-size: clamp(2.18rem, 9vw, 3rem); }
      .hero p { max-width: 20em; }
      .hero-art { right: -45px; transform: translateY(-50%) scale(0.78); opacity: 0.18; }
      .controls { grid-template-columns: minmax(0, 1fr); padding: 12px; gap: 10px; }
      .cards, .cards[data-count="4"] { grid-template-columns: minmax(0, 1fr); }
      .card-face { min-height: 132px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .word-card { animation: none; }
    }
  </style>
  <script src="../words.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="back-link" href="../index.html"><span aria-hidden="true">←</span> ことばクエスト</a>
    </div>
  </header>
  <main class="wrap">
    <div class="hero">
      <div>
        <h1>ことばくじ</h1>
        <p>カードを開くと、ことばの意味と使い方がわかります。</p>
      </div>
      <div class="hero-art" aria-hidden="true"></div>
    </div>
    <form id="draw-form" class="controls" aria-label="くじの設定">
      <div>
        <label for="category" class="control-label">ことばの種類</label>
        <select id="category" name="category" class="select">
          <option value="all">すべてミックス</option>
          <option value="proverb">ことわざ</option>
          <option value="idiom">慣用句</option>
          <option value="koji">四字熟語</option>
          <option value="phrase">会話の決まり文句</option>
        </select>
      </div>
      <fieldset>
        <legend class="control-label">カードの枚数</legend>
        <div class="count-options">
          <input class="sr-only" id="count-auto" type="radio" name="count" value="auto" aria-label="おまかせ、3〜5枚" checked>
          <label for="count-auto">おまかせ</label>
          <input class="sr-only" id="count-three" type="radio" name="count" value="3">
          <label for="count-three">3枚</label>
          <input class="sr-only" id="count-four" type="radio" name="count" value="4">
          <label for="count-four">4枚</label>
          <input class="sr-only" id="count-five" type="radio" name="count" value="5">
          <label for="count-five">5枚</label>
        </div>
      </fieldset>
      <button class="draw-button" type="submit">引き直す</button>
    </form>
    <section aria-labelledby="result-title">
      <div class="result-heading">
        <h2 id="result-title">今回のことば</h2>
        <p class="result-count" id="result-count"></p>
      </div>
      <p class="sr-only" id="draw-status" role="status"></p>
      <div id="cards" class="cards"></div>
      <noscript><p>カードを引くにはJavaScriptを有効にしてください。</p></noscript>
    </section>
  </main>
  <template id="card-template">
    <details class="word-card">
      <summary class="card-face">
        <span class="category-badge"></span>
        <span class="phrase"></span>
        <span class="reading"></span>
        <span class="card-action">意味と例文<span class="chevron" aria-hidden="true"></span></span>
      </summary>
      <dl class="card-notes">
        <div><dt>意味</dt><dd class="meaning"></dd></div>
        <div><dt>例文</dt><dd class="example"></dd></div>
      </dl>
    </details>
  </template>
</body>
</html>
