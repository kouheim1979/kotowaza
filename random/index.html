<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F7FB">
  <meta name="description" content="ことわざ・慣用句・四字熟語・きまり文句のかるたを引いて、意味と使い方を学べます。">
  <title>ことばくじ ｜ ことばクエスト</title>
  <style>
    /* ことばクエスト本体（../index.html）と同じデザイン */
    :root {
      --paper: #F3F7FB;
      --grid: #DFE8F2;
      --ink: #1E2B3A;
      --ink-2: #4E5B6B;
      --line: #CBD6E2;
      --edge: #B9C6D4;
      --red: #D7353D;
      --red-edge: #A3232A;
      --blue: #2E5FD3;
      --focus: #FFC23C;

      --c-idiom: #E06B12;   --t-idiom: #FFF2E6;   --d-idiom: #9E4808;
      --c-proverb: #23945A; --t-proverb: #E7F6EE; --d-proverb: #17683E;
      --c-koji: #3760D6;    --t-koji: #EBF0FE;    --d-koji: #2645A3;
      --c-phrase: #11828F;  --t-phrase: #E2F4F6;  --d-phrase: #0B5F69;

      --font-ui: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "BIZ UDPGothic", "BIZ UDPゴシック", "Meiryo", "Noto Sans JP", "Noto Sans CJK JP", system-ui, sans-serif;
      --font-word: "UD Digi Kyokasho NP-B", "UD デジタル 教科書体 NP-B", "UD Digi Kyokasho N-B", "UD デジタル 教科書体 N-B", "Klee", "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "BIZ UDPGothic", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
    }

    [data-cat="idiom"]   { --cat: var(--c-idiom);   --cat-tint: var(--t-idiom);   --cat-dark: var(--d-idiom); }
    [data-cat="proverb"] { --cat: var(--c-proverb); --cat-tint: var(--t-proverb); --cat-dark: var(--d-proverb); }
    [data-cat="koji"]    { --cat: var(--c-koji);    --cat-tint: var(--t-koji);    --cat-dark: var(--d-koji); }
    [data-cat="phrase"]  { --cat: var(--c-phrase);  --cat-tint: var(--t-phrase);  --cat-dark: var(--d-phrase); }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 17px;
      line-height: 1.7;
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 22px 22px;
      overflow-wrap: anywhere;
      word-break: auto-phrase;
      text-wrap: pretty;
    }

    button, input { font: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    p { margin: 0; }
    h1, h2 { margin: 0; line-height: 1.35; }

    [hidden] { display: none !important; }
    :focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }

    ruby { ruby-align: center; }
    rt { font-size: 0.5em; font-weight: 700; letter-spacing: 0; }
    .furi-off rt, .furi-off .furi { display: none; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: max(14px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
    }

    .wrap > * + * { margin-top: 14px; }

    .back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 4px 16px 4px 12px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      font-weight: 800;
      text-decoration: none;
    }

    .back::before {
      content: "";
      width: 9px; height: 9px;
      border: solid currentColor;
      border-width: 0 0 3px 3px;
      transform: rotate(45deg);
    }

    .kana-mark {
      display: inline-grid;
      place-items: center;
      flex: none;
      width: 2.1em;
      height: 2.1em;
      border: 2.5px solid var(--red);
      border-radius: 50%;
      background: #fff;
      color: var(--red);
      font-family: var(--font-word);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }

    .page-head { display: flex; align-items: center; gap: 12px; }
    .page-head .kana-mark { font-size: 20px; border-width: 3px; }
    .page-head h1 { font-family: var(--font-word); font-size: clamp(32px, 9vw, 44px); letter-spacing: 0.06em; }
    .lead { color: var(--ink-2); font-weight: 800; word-break: keep-all; word-break: auto-phrase; }

    .controls {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 14px 16px 16px;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 3px 0 var(--edge);
    }

    .group { margin: 0; padding: 0; border: 0; min-inline-size: 0; }
    .group legend { float: left; width: 100%; margin-bottom: 6px; padding: 0; font-size: 15px; font-weight: 800; color: var(--ink-2); }
    .group legend + * { clear: both; }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips.count { display: grid; grid-template-columns: minmax(0, 1.45fr) repeat(3, minmax(0, 1fr)); gap: 6px; }
    .chip { position: relative; }
    .chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .chip span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 46px;
      padding: 4px 14px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    .chips.count .chip span { padding: 4px 4px; }
    .chip input:checked + span { border-color: var(--ink); background: var(--ink); color: #fff; }
    .chip input:focus-visible + span { outline: 4px solid var(--focus); outline-offset: 2px; }

    .draw {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 60px;
      border: 0;
      border-radius: 14px;
      background: var(--red);
      box-shadow: 0 4px 0 var(--red-edge);
      color: #fff;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: transform 0.06s ease, box-shadow 0.06s ease;
    }
    .draw:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-edge); }

    .result-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .result-head h2 { font-size: 19px; }
    .result-count { color: var(--ink-2); font-size: 15px; font-weight: 800; }
    .toggle-all {
      margin-left: auto;
      min-height: 44px;
      padding: 4px 12px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 14px; }
    .cards[data-count="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .karuta {
      position: relative;
      background: #fff;
      border: 3px solid var(--cat, var(--ink));
      border-radius: 10px;
      box-shadow:
        inset 0 0 0 3px #fff,
        inset 0 0 0 5px var(--cat-tint, #EEF2F7),
        0 3px 0 var(--edge);
    }

    .kcard { animation: deal 0.28s ease-out both; }
    .kcard:nth-child(2) { animation-delay: 0.05s; }
    .kcard:nth-child(3) { animation-delay: 0.1s; }
    .kcard:nth-child(4) { animation-delay: 0.15s; }
    .kcard:nth-child(5) { animation-delay: 0.2s; }

    .card-face {
      display: grid;
      gap: 2px;
      padding: 14px 16px 12px;
      cursor: pointer;
      list-style: none;
    }
    .card-face::-webkit-details-marker { display: none; }
    .card-face:focus-visible { outline-offset: -6px; border-radius: 8px; }

    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-top .kana-mark { font-size: 15px; border-width: 2px; }

    .tag {
      display: inline-block;
      padding: 1px 10px;
      border-radius: 999px;
      background: var(--cat-tint);
      color: var(--cat-dark);
      font-size: 13.5px;
      font-weight: 800;
      line-height: 1.8;
    }

    .reading { display: block; margin-top: 6px; color: var(--ink-2); font-size: 14px; font-weight: 700; letter-spacing: 0.06em; line-height: 1.4; }
    .phrase {
      display: block;
      font-family: var(--font-word);
      font-size: clamp(24px, 6.4vw, 30px);
      font-weight: 700;
      line-height: 1.35;
      text-wrap: balance;
    }

    .card-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-self: start;
      margin-top: 8px;
      padding: 2px 14px;
      border-radius: 999px;
      background: var(--cat-tint);
      color: var(--cat-dark);
      font-size: 14.5px;
      font-weight: 800;
      line-height: 1.9;
    }
    .card-action .when-open { display: none; }
    [open] .card-action .when-open { display: inline; }
    [open] .card-action .when-closed { display: none; }

    .chevron {
      width: 0.5em;
      height: 0.5em;
      border: solid currentColor;
      border-width: 0 2.5px 2.5px 0;
      transform: translateY(-20%) rotate(45deg);
    }
    [open] .chevron { transform: translateY(20%) rotate(225deg); }

    .card-notes { display: grid; gap: 10px; margin: 0; padding: 4px 16px 16px; animation: open 0.2s ease-out both; }
    .card-notes dt {
      display: inline-block;
      margin-bottom: 2px;
      padding: 0 8px;
      border-radius: 6px;
      background: var(--cat-tint);
      color: var(--cat-dark);
      font-size: 13.5px;
      font-weight: 800;
      line-height: 1.8;
    }
    .card-notes dd { margin: 0; }
    .hl { background: linear-gradient(transparent 58%, #FFE27A 58%); font-weight: 800; }

    @keyframes deal {
      from { opacity: 0; transform: translateY(8px) rotate(-1.5deg); }
      to { opacity: 1; transform: none; }
    }
    @keyframes open {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 760px) {
      .cards, .cards[data-count="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 560px) {
      .cards, .cards[data-count="4"] { grid-template-columns: minmax(0, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-delay: 0s !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
  <script src="../words.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="wrap">
    <a class="back" href="../index.html">ことばクエスト</a>

    <header class="page-head">
      <span class="kana-mark" aria-hidden="true">こ</span>
      <h1>ことばくじ</h1>
    </header>
    <p class="lead">カードを ひらくと、いみと つかいかたが わかるよ。</p>

    <form id="draw-form" class="controls" aria-label="くじの せってい">
      <fieldset class="group">
        <legend>ことばの しゅるい</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="category" value="all" checked><span>ぜんぶ</span></label>
          <label class="chip"><input type="radio" name="category" value="proverb"><span>ことわざ</span></label>
          <label class="chip"><input type="radio" name="category" value="idiom"><span><ruby>慣用句<rt>かんようく</rt></ruby></span></label>
          <label class="chip"><input type="radio" name="category" value="koji"><span><ruby>四字熟語<rt>よじじゅくご</rt></ruby></span></label>
          <label class="chip"><input type="radio" name="category" value="phrase"><span>きまり<ruby>文句<rt>もんく</rt></ruby></span></label>
        </div>
      </fieldset>
      <fieldset class="group">
        <legend>カードの まいすう</legend>
        <div class="chips count">
          <label class="chip"><input type="radio" name="count" value="auto" aria-label="おまかせ（3〜5まい）" checked><span>おまかせ</span></label>
          <label class="chip"><input type="radio" name="count" value="3"><span>3まい</span></label>
          <label class="chip"><input type="radio" name="count" value="4"><span>4まい</span></label>
          <label class="chip"><input type="radio" name="count" value="5"><span>5まい</span></label>
        </div>
      </fieldset>
      <button class="draw" type="submit">もう一回 ひく</button>
    </form>

    <section aria-labelledby="result-title">
      <div class="result-head">
        <h2 id="result-title">こんかいの ことば</h2>
        <p class="result-count" id="result-count"></p>
        <button class="toggle-all" type="button" id="toggle-all">ぜんぶ ひらく</button>
      </div>
      <p class="sr-only" id="draw-status" role="status"></p>
      <div id="cards" class="cards" style="margin-top:12px"></div>
      <noscript><p>カードを ひくには、JavaScript を オンに してね。</p></noscript>
    </section>
  </main>

  <template id="card-template">
    <details class="karuta kcard">
      <summary class="card-face">
        <span class="card-top"><span class="tag"></span><span class="kana-mark" aria-hidden="true"></span></span>
        <span class="reading furi"></span>
        <span class="phrase"></span>
        <span class="card-action"><span class="when-closed">ひらいて いみを 見る</span><span class="when-open">とじる</span><span class="chevron" aria-hidden="true"></span></span>
      </summary>
      <dl class="card-notes">
        <div><dt>いみ</dt><dd class="meaning"></dd></div>
        <div><dt>つかいかた</dt><dd class="example"></dd></div>
      </dl>
    </details>
  </template>
</body>
</html>
